# SeeedMote v2 — BTHome airframe contract (mote -> gateway, uplink only).
#
# This file records the default BLE advertisement profile used by SeeedMote.
# It intentionally uses BTHome v2 Service Data instead of a private
# manufacturer-specific frame so generic scanners and Home Assistant style
# integrations can consume the sensor data without a custom parser.
#
# BTHome reference:
#   - Service Data 16-bit UUID: 0xFCD2, little-endian on air as D2 FC.
#   - Device information byte follows the UUID.
#   - Object ids are sorted from low to high.
#   - Unknown object ids stop parsing for generic receivers.
#
# Changing this file is a cross-device change. The mote payload builder and
# every gateway parser must be updated in the same review.

contract:
  name: seeedmote-bthome-airframe
  version: 1
  direction: mote_to_gateway
  transport: ble-adv-service-data-16
  service_uuid: 0xFCD2
  bthome_version: 2
  encrypted: false
  trigger_based: true
  byte_order: little-endian
  total_service_data_bytes: 14  # includes UUID + BTHome device info + objects

service_data:
  - name: service_uuid
    offset: 0
    size: 2
    value_on_air: [0xD2, 0xFC]
    note: BTHome UUID 0xFCD2 in little-endian BLE Service Data order.

  - name: device_info
    offset: 2
    size: 1
    value: 0x44
    note: |
      BTHome v2 (bits 5..7 = 010), unencrypted (bit 0 = 0),
      trigger-based / irregular advertisements (bit 2 = 1).

objects:
  - name: packet_id
    object_id: 0x00
    offset: 3
    size: 2
    type: uint8
    bthome_property: packet_id
    note: |
      Low 8 bits of event_counter. BTHome receivers can use this to filter
      repeated advertisements carrying unchanged data.

  - name: moving
    object_id: 0x22
    offset: 5
    size: 2
    type: uint8
    bthome_property: moving
    values:
      0: not_moving
      1: moving

  - name: vibration
    object_id: 0x2C
    offset: 7
    size: 2
    type: uint8
    bthome_property: vibration
    values:
      0: clear
      1: detected
    note: Transient strong-motion pulse.

  - name: count
    object_id: 0x3E
    offset: 9
    size: 5
    type: uint32
    bthome_property: count
    note: |
      Monotonic per-boot event counter, incremented on every payload update.
      Repeated advertisements with the same value are duplicates.

gateway_output:
  status: informational
  schema: |
    {
      "ts":        <int>,    // gateway uptime in ms
      "gw_id":     <hex>,    // gateway BLE MAC, 12 hex chars
      "mote_mac":  <hex>,    // mote BLE MAC, 12 hex chars
      "rssi":      <int>,    // dBm, gateway-reported
      "moving":    <bool>,   // BTHome moving object
      "vibration": <bool>,   // BTHome vibration object
      "pid":       <int>,    // BTHome packet id object, 255 if absent
      "ctr":       <int>     // BTHome count object, 0 if absent
    }

deduplication:
  gateway: none
  bthome_duplicate_filter: [mote_mac, pid]
  business_consumer_key: [mote_mac, ctr]
  note: |
    packet_id follows the BTHome duplicate-filter convention. count keeps a
    wider per-boot event counter for business consumers. A later product
    build should make count persistent or use BTHome encryption counter
    semantics if cross-reboot deduplication matters.

security:
  authenticity: none-yet
  notes: |
    v1 is unencrypted BTHome for fast prototyping and open ecosystem
    compatibility. Before deployments with real consequence, add bindkey
    encryption or a product-level allowlist/replay policy at the gateway.
