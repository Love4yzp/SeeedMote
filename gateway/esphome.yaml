substitutions:
  device_name: seeedmote-gateway

esphome:
  name: ${device_name}
  friendly_name: SeeedMote Gateway

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

mqtt:
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password

external_components:
  - source:
      type: git
      url: https://github.com/dz0ny/esphome-bthome
      ref: main
    components: [bthome_receiver]

esp32_ble_tracker:
  scan_parameters:
    active: false

bthome_receiver:
  ble_stack: bluedroid
  devices:
    - mac_address: !secret mote_mac
      name: SeeedMote

binary_sensor:
  - platform: bthome_receiver
    mac_address: !secret mote_mac
    moving:
      name: "Moving"
    vibration:
      name: "Vibration"

sensor:
  - platform: bthome_receiver
    mac_address: !secret mote_mac
    count_uint32:
      name: "Count"
