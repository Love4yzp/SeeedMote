substitutions:
  device_name: seeedmote-gateway

esphome:
  name: ${device_name}
  friendly_name: SeeedMote Gateway

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

mqtt:
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password

esp32_ble_tracker:
  scan_parameters:
    active: false

bthome:
  - mac_address: !secret mote_mac
    name: SeeedMote
    ibeacon_uuid: ""
    binary_sensors:
      - platform: bthome
        name: Moving
        type: moving
      - platform: bthome
        name: Vibration
        type: vibration
    sensors:
      - platform: bthome
        name: Count
        type: count
