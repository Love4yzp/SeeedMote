substitutions:
  device_name: seeedmote-gw
  gateway_firmware_version: "2026.06.08"
  gateway_command_topic: seeedmote/gateway/cmd

esphome:
  name: ${device_name}
  friendly_name: SeeedMote Gateway
  name_add_mac_suffix: true
  on_boot:
    priority: 800
    then:
      - lambda: |-
          id(mqtt_client).set_username(App.get_name().c_str());

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

logger:

web_server:
  port: 80

ota:
  - platform: esphome

output:
  - platform: gpio
    id: user_led
    pin:
      number: GPIO21
      inverted: true

script:
  - id: locate_blink
    mode: restart
    then:
      - repeat:
          count: 12
          then:
            - output.turn_on: user_led
            - delay: 150ms
            - output.turn_off: user_led
            - delay: 150ms
  # Retained gateway status (firmware config version). Published on every MQTT
  # (re)connect AND refreshed periodically by the interval below, so a publish
  # that races the connection handshake can't leave the broker without a
  # retained frame. publish() is a no-op while disconnected, so the interval is
  # safe to fire before MQTT is up.
  - id: publish_status
    then:
      - lambda: |-
          const std::string gw = App.get_name();
          const std::string topic = std::string("seeedmote/gateway/") + gw + "/status";
          const std::string payload = std::string("{\"gw\":\"") + gw
                                    + "\",\"version\":\"${gateway_firmware_version}\"}";
          id(mqtt_client).publish(topic, payload, 0, true);

interval:
  - interval: 60s
    then:
      - script.execute: publish_status

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "SeeedMote Gateway"

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  password: !secret mqtt_password
  topic_prefix: null
  discovery: false
  discover_ip: false
  birth_message: null
  will_message: null
  shutdown_message: null
  log_topic: null
  on_connect:
    then:
      - script.execute: publish_status
  on_json_message:
    - topic: ${gateway_command_topic}
      qos: 1
      then:
        - lambda: |-
            if (!x["gw"].is<const char *>() || !x["cmd"].is<const char *>()) return;
            const char *gw = x["gw"];
            const char *cmd = x["cmd"];
            if (gw == nullptr || cmd == nullptr) return;
            if (std::string(gw) != App.get_name()) return;
            if (std::string(cmd) == "locate") {
              id(locate_blink).execute();
            }

# Phase 0 (v4): raw BTHome v2 parse.
#
# Why not the `bthome_receiver` external component? It's modeled around
# per-device sensor mapping (Home Assistant style) — it doesn't expose raw
# RSSI per packet, doesn't let you route a single BTHome object_id to
# different MQTT topics based on its value (event vs online split), and
# binds each mote by a hardcoded MAC. v4 needs multi-mote, per-packet RSSI,
# and payload-based routing, so we parse the adv directly. The block below
# is ~40 lines and is the entirety of the gateway's BTHome surface.
#
# Forward compatibility: the parser walks BTHome objects by id+length
# rather than hardcoded offsets, so it keeps working when Phase 1 drops the
# `vibration` (0x2C) and `count` (0x3E) objects from the mote firmware.
esp32_ble_tracker:
  scan_parameters:
    active: false
    # The mote only carries BTHome service data during a ~500ms event burst
    # (5 packets @ 100ms), then drops it for the 30s config window. The ESPHome
    # default scan (interval 320ms / window 30ms = ~9% duty) frequently misses
    # the entire burst -> intermittent MQTT. Near-continuous scan (90% duty)
    # makes each burst near-certain to be caught; the 10ms gap per cycle leaves
    # the shared radio room for WiFi/MQTT coexistence on the single ESP32-S3 antenna.
    interval: 100ms
    window: 90ms
  on_ble_advertise:
    then:
      - lambda: |-
          // Filter on the BTHome v2 service UUID only. Don't gate on
          // x.get_name(): under passive scanning (`active: false`) and a
          // mote firmware that doesn't put the name in ADV_IND, get_name()
          // returns an empty string and every packet would be silently
          // dropped. The UUID 0xFCD2 is BTHome v2 generic; the parser below
          // requires both packet_id (0x00) and moving (0x22) to be present,
          // which narrows further to our own mote's adv shape in practice.
          for (auto &sd : x.get_service_datas()) {
            if (sd.uuid != esphome::esp32_ble_tracker::ESPBTUUID::from_uint16(0xFCD2)) continue;
            if (sd.data.size() < 1) continue;
            if (sd.data[0] != 0x44) continue;  // device_info: BTHome v2, unencrypted, trigger-based

            // BTHome v2 object-id walk. Sizes are hardcoded for the ids
            // this firmware emits today; an unknown id bails out (we can't
            // know its length without a full size table).
            bool have_pid = false, have_moving = false, parse_err = false;
            uint8_t packet_id = 0, moving = 0;
            size_t i = 1;
            while (i < sd.data.size()) {
              uint8_t obj = sd.data[i];
              size_t need;
              switch (obj) {
                case 0x00: need = 1; break;  // packet_id, uint8
                case 0x22: need = 1; break;  // moving, bool uint8
                case 0x2C: need = 1; break;  // vibration, bool uint8 (P1 drops; tolerated)
                case 0x3E: need = 4; break;  // count, uint32 LE (P1 drops; tolerated)
                default:   parse_err = true; need = 0; break;
              }
              if (parse_err) break;
              if (i + 1 + need > sd.data.size()) { parse_err = true; break; }
              if (obj == 0x00) { packet_id = sd.data[i + 1]; have_pid = true; }
              else if (obj == 0x22) { moving = sd.data[i + 1]; have_moving = true; }
              i += 1 + need;
            }
            if (parse_err || !have_pid || !have_moving) continue;

            std::string mac_key;
            for (char c : x.address_str()) {
              if (c != ':') mac_key += (char)::tolower((unsigned char)c);
            }

            // Per-gateway dedup. The mote sends each event as a 5-packet
            // burst sharing one packet_id; with the scan window now wide
            // enough to catch several of them, suppress republishing a
            // packet_id we already forwarded for this mac. packet_id is
            // monotonic per mote, so comparing against the last value we saw
            // is enough — consecutive bursts (and a reboot's reset to 1)
            // always differ. Cross-gateway dedup still belongs consumer-side
            // on (mac, packet_id): other gateways forward the same id with
            // their own rssi, which is intended.
            static std::map<std::string, uint8_t> last_pid;
            auto seen = last_pid.find(mac_key);
            if (seen != last_pid.end() && seen->second == packet_id) continue;
            last_pid[mac_key] = packet_id;

            // Topic split: moving=1 is a motion event; moving=0 is the
            // boot heartbeat. Use "seen" rather than "online" because the
            // mote is event-driven and does not maintain a live session.
            const char *suffix = (moving == 1) ? "/event" : "/seen";
            std::string topic = std::string("seeedmote/mote/") + mac_key + suffix;

            std::string payload;
            if (moving == 1) {
              payload = std::string("{\"packet_id\":") + std::to_string(packet_id)
                      + ",\"rssi\":" + std::to_string(x.get_rssi())
                      + ",\"gw\":\"" + App.get_name() + "\"}";
            } else {
              payload = std::string("{\"rssi\":") + std::to_string(x.get_rssi())
                      + ",\"gw\":\"" + App.get_name()
                      + "\",\"reason\":\"boot\"}";
            }

            id(mqtt_client).publish(topic, payload);
          }
