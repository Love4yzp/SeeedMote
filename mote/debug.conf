# SeeedMote v2 — debug overlay.
#
# Adds USB CDC ACM console so log output is visible over the USB-C cable
# without an SWD/RTT probe. The XIAO nRF52840 Sense does not expose SWD on
# the standard header, so this is the practical default for desk debugging.
#
# Apply with:  make build DEBUG=1
#
# Cost: ~3 mA continuous quiescent current — never ship this in a battery
# build. The default prj.conf already routes logs to RTT.
#
# Note: prj.conf hard-disables CONSOLE / UART_CONSOLE / LOG_BACKEND_UART /
# SERIAL so that the release build truly drops them (the xiao_ble board
# defconfig would otherwise force them on whenever USB_DEVICE_STACK=y).
# Here we re-enable each one explicitly.

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="seeedmote-motion"
CONFIG_USB_DEVICE_VID=0x2886
CONFIG_USB_DEVICE_PID=0x0045

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Defer USB init until main() calls usb_enable(); otherwise USB races BT
# controller setup in SYS_INIT and the chip panics before LED ever blinks.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# Route Zephyr LOG_* through the USB CDC UART exposed by the board overlay.
CONFIG_LOG_BACKEND_UART=y

# Needed for sys_reboot() in the 1200-baud touch DFU trigger (see main.c).
CONFIG_REBOOT=y
