# SeeedMote v2 — mote_motion_nrf52840 Zephyr config.
#
# Production / low-power defaults. Wakes the MCU only on IMU data-ready and
# stays in System ON sleep otherwise (CONFIG_PM=y → WFI in idle).
#
# For a build with USB CDC console (hands-free dev without an SWD probe),
# overlay debug.conf:
#   make build DEBUG=1
#
# OTA is explicitly disabled. Settings/NVS uses the board's existing
# storage_partition for Web BT IMU tuning persistence.

# --- Logging (RTT only by default; UART backend lives in debug.conf) -------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y

# --- Power management ------------------------------------------------------
# nRF52840 in NCS v2.9.2 does NOT select HAS_PM, so CONFIG_PM is silently
# dropped — and we don't need it. Cortex-M's default arch_cpu_idle() already
# emits WFI in the idle thread, which lands the chip in System ON sleep
# (clock stopped, RAM retained, peripheral interrupts wake). The real
# low-power gates are: no USB CDC, no blink thread, sem waits K_FOREVER
# when there's no burst pending. See main.c.
#
# PM_DEVICE is independent and does work — it lets the LSM6DSL driver
# expose suspend/resume hooks (useful for Stage 2).
CONFIG_PM_DEVICE=y

# --- GPIO / I2C / sensor framework -----------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y

# LSM6DS3TR-C uses the LSM6DSL-compatible binding in NCS / Zephyr.
CONFIG_LSM6DSL=y

# --- Bluetooth -------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SEEED-BOOT"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_APPEARANCE=0

# Web BT config service uses sys_reboot() for the "factory reset" command.
CONFIG_REBOOT=y

# --- Persistent Web BT tuning ---------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Explicitly off --------------------------------------------------------
# The xiao_ble board defconfig force-enables USB_DEVICE_STACK + a USB CDC
# console, and the board DTS pins zephyr,console = &usb_cdc_acm_uart. To
# get a true release build (no ~3 mA USB quiescent draw) we have to undo
# all of that explicitly here; debug.conf flips the USB knobs back on.
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

CONFIG_SHELL=n
CONFIG_FILE_SYSTEM=n
