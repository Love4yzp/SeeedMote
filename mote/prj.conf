# SeeedMote v2 — mote_motion_nrf52840 Zephyr config.
#
# First version brings up:
#   - LSM6DS3TR-C IMU on i2c0 (motion trigger via INT1 pin)
#   - State machine: STILL / MOVING / PICK_UP (PUT_DOWN inferred consumer-side)
#   - BLE non-connectable advertising with BTHome v2 Service Data
#   - RTT logging (no UART console)
#
# Default air format is broadcast-only BTHome. GATT config, OTA and other
# connection-oriented features are separate product decisions, not part of
# this baseline mote.
#
# OTA / settings subsystem are explicitly disabled — pm_static.yml still
# carves out a settings partition so v2 can flip CONFIG_SETTINGS=y without
# moving anything in flash.

# --- Logging ---------------------------------------------------------------
# Deferred mode so log calls don't block when USB CDC isn't linked yet.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=y

# --- USB CDC console (debug visibility without SWD probe) -----------------
# board chosen zephyr,console = &usb_cdc_acm_uart, so enabling these
# routes printk + LOG_BACKEND_UART through the device's native USB.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="seeedmote-motion"
CONFIG_USB_DEVICE_VID=0x2886
CONFIG_USB_DEVICE_PID=0x0045
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
# Defer USB init until main() calls usb_enable(); otherwise USB races BT
# controller setup in SYS_INIT and the chip panics before LED ever blinks.
# (Matches zephyr/samples/subsys/usb/cdc_acm/prj.conf.)
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# --- GPIO / I2C / sensor framework -----------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y

# LSM6DS3TR-C uses the LSM6DSL-compatible binding in NCS / Zephyr.
# If `west build` fails on this symbol, check zephyr/drivers/sensor/ for the
# actual Kconfig name shipping in NCS v2.9.2 and update here.
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_GLOBAL_THREAD=y

# --- Bluetooth -------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="seeedmote-motion"
CONFIG_BT_DEVICE_APPEARANCE=0

# --- Explicitly off --------------------------------------------------------
CONFIG_SHELL=n
CONFIG_FILE_SYSTEM=n
CONFIG_SETTINGS=n
