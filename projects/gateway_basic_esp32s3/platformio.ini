; SeeedMote v2 — gateway_basic_esp32s3 (per-project PIO config).
;
; Each project under projects/<name>/ is a self-contained PlatformIO project.
; Run from repo root:    pio run -d projects/gateway_basic_esp32s3
; Or from this dir:      pio run

[platformio]
default_envs = gateway_basic_esp32s3
boards_dir   = ../../boards

[env:gateway_basic_esp32s3]
platform        = espressif32@6.7.0
framework       = espidf
board           = seeed_xiao_esp32s3
build_flags     = -Wall -Wextra
monitor_speed   = 115200
