; SeeedMote v2 — gateway_basic_esp32s3 (per-project PIO config).
;
; Each project under projects/<name>/ is a self-contained PlatformIO project.
; Run from repo root:    pio run -d projects/gateway_basic_esp32s3
; Or from this dir:      pio run

[platformio]
default_envs = gateway_basic_esp32s3
boards_dir   = ../../boards

[env:gateway_basic_esp32s3]
platform        = espressif32@6.7.0
framework       = espidf
board           = seeed_xiao_esp32s3
; PIO selects the partition CSV via board.build.partitions and IGNORES the
; sdkconfig CONFIG_PARTITION_TABLE_* setting (see PIO espidf.py:1925). The
; default is partitions_singleapp.csv (1 MB app). WiFi + NimBLE baseline is
; ~900 KB, so we pin the larger CSV (1.5 MB app) here explicitly.
board_build.partitions = partitions_singleapp_large.csv
build_flags     =
    -Wall
    -Wextra
    -DSEEEDMOTE_MQTT_BROKER_URI=\"mqtt://10.8.0.164:1883\"
    -DSEEEDMOTE_MQTT_TOPIC_PREFIX=\"mote\"
monitor_speed   = 115200
monitor_filters = direct
