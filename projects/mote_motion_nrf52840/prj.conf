# SeeedMote v2 — mote_motion_nrf52840.
#
# Bring-up step 2 of the recovery plan documented in src/main.c:
#   blink + bt_enable + BT_LE_ADV with static SeeedMote payload.
#
# Earlier panic happened with BT + USB CDC + IMU enabled simultaneously
# before the scheduler ran. We re-add BT alone (no USB CDC, no IMU) and
# explicitly disable every console path that the xiao_ble Sense board
# defconfig might pull in.

# --- Logging --------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
# Force-off every non-RTT log/console path so it cannot conflict with BT.
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n

# --- Drivers --------------------------------------------------------------
CONFIG_GPIO=y

# --- Subsystems we explicitly do NOT want for step 2 ---------------------
CONFIG_SHELL=n
CONFIG_FILE_SYSTEM=n
CONFIG_SETTINGS=n

# --- Bluetooth (broadcaster only) ----------------------------------------
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
# No need to keep host name-resolution / GATT / SMP for non-connectable adv.
CONFIG_BT_DEVICE_NAME="SeeedMote"
