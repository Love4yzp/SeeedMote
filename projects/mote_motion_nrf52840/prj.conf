# SeeedMote v2 — mote_motion_nrf52840 Zephyr config.
#
# Minimum viable: GPIO for LED, logging via RTT (so an SWD probe sees boot
# messages without USB CDC overhead). UART backend is off because the XIAO
# nRF52840 Sense routes its USB-CDC console through the Adafruit bootloader,
# not the Zephyr UART driver — adding USB CDC here just adds bloat.

CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y

# Keep the binary tight — no BT, no shell, no fs at hello-blink stage.
CONFIG_BT=n
CONFIG_SHELL=n
CONFIG_FILE_SYSTEM=n
